# Adapted from the workflow generated by FAST 0-org-setup.
#
# Differences from the generated original, and why:
#   - Fabric is cloned from public GitHub at a pinned tag instead of being
#     pulled from a private modules repo over SSH. The generated workflow needs
#     secrets.CICD_MODULES_KEY, which assumes a private module mirror we do not
#     have.
#   - Terraform runs in fabric/fast/stages/0-org-setup, not the repo root. This
#     repo holds config/, not stage code.
#   - The tfvars copy step is dropped. The generated workflow copies
#     0-org-setup.auto.tfvars, but stage 0 emits .json for DOWNSTREAM stages and
#     consumes none of it itself. Auto-loading it would raise undeclared
#     variable errors.
#
# Trust model: plan runs as the read-only service account and is reachable from
# any branch; apply runs as the read-write account and only after a merge to
# main. Both authenticate by Workload Identity Federation - there is no service
# account key anywhere in this repository.

name: "FAST org-setup stage"

on:
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - synchronize

env:
  FAST_SERVICE_ACCOUNT: iac-org-cicd-rw@dpslab-prod-iac-core-0.iam.gserviceaccount.com
  FAST_SERVICE_ACCOUNT_PLAN: iac-org-cicd-ro@dpslab-prod-iac-core-0.iam.gserviceaccount.com
  FAST_WIF_PROVIDER: projects/273934713254/locations/global/workloadIdentityPools/default/providers/github-default
  OUTPUTS_BUCKET: gs://dpslab-prod-iac-core-0-iac-outputs
  FABRIC_REPO: https://github.com/GoogleCloudPlatform/cloud-foundation-fabric.git
  FABRIC_VERSION: v57.0.0
  STAGE_DIR: fabric/fast/stages/0-org-setup
  TF_VARFILE: ../../../../config/0-org-setup/terraform.tfvars
  TF_PROVIDERS_FILE: 0-org-setup-providers.tf
  TF_PROVIDERS_FILE_PLAN: 0-org-setup-ro-providers.tf
  TF_VERSION: 1.15.9

jobs:
  fast-pr:
    # Skip PRs closed without being merged.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true ||
      github.event.action == 'opened' ||
      github.event.action == 'synchronize'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Check out this repository
        uses: actions/checkout@v4

      - id: fabric
        name: Clone Fabric at pinned tag
        run: |
          git clone --quiet --depth 1 --branch "${FABRIC_VERSION}" \
            "${FABRIC_REPO}" fabric
          echo "Fabric at $(git -C fabric describe --tags)"

      - id: vars-plan
        if: github.event.pull_request.merged != true && success()
        name: Select read-only identity
        run: |
          echo "plan_opts=-lock=false" >> "$GITHUB_ENV"
          echo "provider_file=${{env.TF_PROVIDERS_FILE_PLAN}}" >> "$GITHUB_ENV"
          echo "service_account=${{env.FAST_SERVICE_ACCOUNT_PLAN}}" >> "$GITHUB_ENV"

      - id: vars-apply
        if: github.event.pull_request.merged == true && success()
        name: Select read-write identity
        run: |
          echo "provider_file=${{env.TF_PROVIDERS_FILE}}" >> "$GITHUB_ENV"
          echo "service_account=${{env.FAST_SERVICE_ACCOUNT}}" >> "$GITHUB_ENV"

      - id: gcp-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{env.FAST_WIF_PROVIDER}}
          service_account: ${{env.service_account}}
          access_token_lifetime: 900s

      - id: gcp-sdk
        name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - id: tf-config-provider
        name: Fetch generated provider file
        run: |
          gcloud storage cp \
            "${OUTPUTS_BUCKET}/providers/${{env.provider_file}}" \
            "${STAGE_DIR}/"

      - id: tf-setup
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{env.TF_VERSION}}

      - id: tf-init
        name: Terraform init
        continue-on-error: true
        working-directory: ${{env.STAGE_DIR}}
        run: terraform init -no-color

      - id: tf-validate
        name: Terraform validate
        continue-on-error: true
        working-directory: ${{env.STAGE_DIR}}
        run: terraform validate -no-color

      - id: tf-plan
        name: Terraform plan
        continue-on-error: true
        working-directory: ${{env.STAGE_DIR}}
        run: |
          terraform plan -input=false -no-color -out plan.out \
            -var-file="${TF_VARFILE}" ${{env.plan_opts}}

      - id: tf-apply
        if: github.event.pull_request.merged == true && success()
        name: Terraform apply
        continue-on-error: true
        working-directory: ${{env.STAGE_DIR}}
        run: terraform apply -input=false -auto-approve -no-color plan.out

      - id: pr-comment
        name: Post result to the pull request
        continue-on-error: true
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{steps.tf-plan.outputs.stdout}}"
        with:
          script: |
            const plan = (process.env.PLAN || '').split('\n')
              .filter(l => l.match(/^([A-Z\s].*|)$/)).join('\n').slice(0, 55000);
            const body = `### Terraform init \`${{steps.tf-init.outcome}}\`
            ### Terraform validate \`${{steps.tf-validate.outcome}}\`
            ### Terraform plan \`${{steps.tf-plan.outcome}}\`

            <details><summary>Show plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            ### Terraform apply \`${{steps.tf-apply.outcome}}\`

            *by @${{github.actor}} on \`${{github.workflow}}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

      - id: check-init
        name: Fail if init failed
        if: steps.tf-init.outcome != 'success'
        run: exit 1

      - id: check-validate
        name: Fail if validate failed
        if: steps.tf-validate.outcome != 'success'
        run: exit 1

      - id: check-plan
        name: Fail if plan failed
        if: steps.tf-plan.outcome != 'success'
        run: exit 1

      - id: check-apply
        name: Fail if apply failed
        if: github.event.pull_request.merged == true && steps.tf-apply.outcome != 'success'
        run: exit 1
